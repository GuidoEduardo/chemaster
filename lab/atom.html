<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>CheMaster Lab · Build an Atom</title>
  <meta name="author" content="Guido">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="atom.css">
</head>
<body class="sim-body">
  <canvas id="sim"></canvas>

  <header class="sim-top">
    <a class="sim-back" href="./" id="back">← Lab</a>
    <h1 class="sim-title" id="title">Build an Atom</h1>
    <div class="sim-ctl">
      <button class="sim-btn" id="play" title="Space">⏸</button>
      <button class="sim-btn" id="reset" title="R">↺</button>
      <button class="lang-btn" id="langBtn"><span id="langCode">EN</span></button>
    </div>
  </header>

  <aside class="sim-panel" id="panel"></aside>
  <div class="sim-log" id="log"></div>
  <div class="sim-paused" id="pausedTag"></div>

  <details class="sim-missions" id="missions"></details>

  <div class="sim-dock" id="dock">
    <div class="sim-bin p" data-k="p"><div class="bin-pile"><i></i><i></i><i></i><i></i><i></i></div><b></b><small></small></div>
    <div class="sim-bin n" data-k="n"><div class="bin-pile"><i></i><i></i><i></i><i></i><i></i></div><b></b><small></small></div>
    <div class="sim-bin e" data-k="e"><div class="bin-pile"><i></i><i></i><i></i><i></i><i></i></div><b></b><small></small></div>
  </div>
  <div class="sim-hint" id="hint"></div>

  <script src="../js/data.js"></script>
  <script src="../js/nuclear.js"></script>
  <script src="atom.js"></script>
</body>
</html>
